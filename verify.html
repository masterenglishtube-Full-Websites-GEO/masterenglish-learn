<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | Master English أتقن الإنجليزية</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="wrap header-inner">
    <a href="index.html" class="brand">
      <img src="assets/images/profile.jpg" alt="Master English أتقن الإنجليزية" class="brand-avatar">
      <span class="brand-name">Master English <span class="brand-name-ar">أتقن الإنجليزية</span></span>
    </a>
  </div>
</header>

<main>
  <section class="page-hero" style="text-align:center;">
    <div class="wrap" style="max-width:480px;">
      <h1 id="verifyTitle">جارِ تسجيل الدخول...</h1>
      <p class="hero-sub" id="verifySub">لحظة واحدة من فضلك.</p>
      <a href="index.html" id="verifyHomeLink" class="btn btn-primary" style="display:none;">الذهاب إلى الصفحة الرئيسية</a>
    </div>
  </section>
</main>

<script>
(function () {
  const API = "https://soft-wave-c3e8-masterenglish-fulfillment.masterenglishtube.workers.dev";
  const params = new URLSearchParams(location.search);
  const token = params.get("token");

  const titleEl = document.getElementById("verifyTitle");
  const subEl = document.getElementById("verifySub");
  const homeLink = document.getElementById("verifyHomeLink");

  function fail(message) {
    titleEl.textContent = "تعذّر تسجيل الدخول";
    subEl.textContent = message;
    homeLink.style.display = "inline-flex";
  }

  if (!token) {
    fail("الرابط غير صالح. تأكد من نسخ الرابط كاملاً من بريدك الإلكتروني.");
  } else {
    fetch(API + "/auth/verify?token=" + encodeURIComponent(token))
      .then((r) => r.json())
      .then((data) => {
        if (!data.ok) {
          fail("هذا الرابط منتهي الصلاحية أو تم استخدامه من قبل. عد إلى الموقع واطلب رابطاً جديداً.");
          return;
        }
        try {
          localStorage.setItem("me_auth_token", data.token);
        } catch (e) {}
        titleEl.textContent = "تم تسجيل الدخول بنجاح ✅";
        subEl.textContent = "جارِ توجيهك...";
        setTimeout(() => { location.href = "index.html"; }, 1200);
      })
      .catch(() => fail("حدث خطأ تقني، حاول مرة أخرى أو راسلنا على noor@masterenglish.me"));
  }
})();
</script>
</body>
</html>
